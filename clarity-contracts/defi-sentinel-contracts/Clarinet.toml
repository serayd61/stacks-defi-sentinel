[project]
name = "defi-sentinel-contracts"
description = "Stacks DeFi Sentinel - Complete smart contract suite"
authors = ["serayd61"]
telemetry = true
cache_dir = "./.cache"

# SIP-010 Trait (must be first)
[contracts.sip-010-trait]
path = "contracts/sip-010-trait.clar"
clarity_version = 3
epoch = 3.0

# Simple Token (standalone, no dependencies) - Clarity 3
[contracts.sentinel-token-simple]
path = "contracts/sentinel-token-simple.clar"
clarity_version = 3
epoch = 3.0

# Simple Token v2 - Clarity 2 Compatible
[contracts.sentinel-token-simple-v2]
path = "contracts/sentinel-token-simple-v2.clar"
clarity_version = 2
epoch = 2.5

# Main DeFi Sentinel
[contracts.defi-sentinel]
path = "contracts/defi-sentinel.clar"
