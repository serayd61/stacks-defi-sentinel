name: Auto Changelog Update

on:
  schedule:
    - cron: '0 9 * * *'  # Her gün 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    name: Update CHANGELOG
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate changelog entry
        id: changelog
        run: |
          # Son 24 saatteki commit'leri al
          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          TODAY=$(date -u '+%Y-%m-%d')
          
          echo "Checking commits since: $SINCE"
          
          # Commit'leri al
          COMMITS=$(git log --since="$SINCE" --pretty=format:"- %s" --no-merges 2>/dev/null || true)
          COMMIT_COUNT=$(echo "$COMMITS" | grep -c "^-" || echo "0")
          
          echo "Found $COMMIT_COUNT commits"
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$COMMIT_COUNT" -eq "0" ] || [ -z "$COMMITS" ]; then
            echo "No commits found in the last 24 hours"
            echo "has_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_commits=true" >> $GITHUB_OUTPUT
          
          # Changelog entry oluştur
          cat > /tmp/new_entry.md << ENTRY_EOF
          
          ## [Daily Update] - $TODAY
          
          ### Changes
          $COMMITS
          
          ENTRY_EOF
          
          echo "Entry created"

      - name: Update CHANGELOG.md
        if: steps.changelog.outputs.has_commits == 'true'
        run: |
          # Yeni entry'yi CHANGELOG'un başına ekle
          if [ -f /tmp/new_entry.md ]; then
            # Header'ı koru, sonra yeni entry ekle
            head -8 CHANGELOG.md > /tmp/changelog_header.md
            tail -n +9 CHANGELOG.md > /tmp/changelog_body.md
            
            cat /tmp/changelog_header.md > CHANGELOG.md
            cat /tmp/new_entry.md >> CHANGELOG.md
            cat /tmp/changelog_body.md >> CHANGELOG.md
            
            echo "CHANGELOG.md updated"
          fi

      - name: Commit and Push
        if: steps.changelog.outputs.has_commits == 'true'
        run: |
          # Değişiklik var mı kontrol et
          if git diff --quiet CHANGELOG.md 2>/dev/null; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add CHANGELOG.md
          git commit -m "chore: Auto-update CHANGELOG [skip ci]

          Daily update with ${{ steps.changelog.outputs.commit_count }} commits
          Generated by GitHub Actions"
          
          git push origin main
          echo "Changes pushed successfully"

      - name: Summary
        if: always()
        run: |
          echo "## Auto Changelog Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commits found: ${{ steps.changelog.outputs.commit_count || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Has commits: ${{ steps.changelog.outputs.has_commits || 'false' }}" >> $GITHUB_STEP_SUMMARY
