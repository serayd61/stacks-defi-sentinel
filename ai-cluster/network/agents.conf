# ============================================================
#  CERF — Agentic Cluster Network Layer
#  Tüm agent API'larına tek noktadan erişim
# ============================================================

upstream ollama_upstream {
    server da-vinci:11434;
    keepalive 4;
}

upstream orchestrator_upstream {
    server orchestrator:9000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    # ── Orchestrator (Cluster yönetim paneli) ──────────────────
    location / {
        proxy_pass         http://orchestrator_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # ── Ollama API (inference) ─────────────────────────────────
    location /llm/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://ollama_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
    }

    # ── Health Check ───────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","cluster":"sentinel-ai"}';
        add_header Content-Type application/json;
    }
}
