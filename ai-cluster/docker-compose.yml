version: "3.9"

# ============================================================
#  AGENTIC AI CLUSTER — Stacks DeFi Sentinel
#  Closed-Loop Network Topology (VPS Edition)
#
#  INFERENCE TIER:  da-vinci  (Ollama)
#  NETWORK LAYER:   cerf      (Nginx)
#  AGENTIC TIER:    satoshi · nakamoto · szabo · finney
# ============================================================

networks:
  sentinel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ollama-data:
  redis-data:
  agent-shared:

services:

  # ──────────────────────────────────────────
  # INFERENCE TIER — Da Vinci (Ollama)
  # Primary LLM node for all agents
  # ──────────────────────────────────────────
  da-vinci:
    image: ollama/ollama:latest
    container_name: da-vinci
    restart: unless-stopped
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.10
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G

  # Model bootstrap — ilk çalıştırmada modeli indirir
  model-init:
    image: ollama/ollama:latest
    container_name: model-init
    networks:
      - sentinel-net
    depends_on:
      da-vinci:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://da-vinci:11434
    entrypoint: >
      sh -c "
        ollama pull phi3:mini &&
        echo 'Model hazır.'
      "
    restart: "no"

  # ──────────────────────────────────────────
  # MESSAGE BUS — Redis (Agent iletişim katmanı)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-bus
    restart: unless-stopped
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.20
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # NETWORK LAYER — Cerf (Nginx)
  # Reverse proxy + agent API gateway
  # ──────────────────────────────────────────
  cerf:
    image: nginx:alpine
    container_name: cerf
    restart: unless-stopped
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.30
    ports:
      - "8080:80"
    volumes:
      - ./network/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./network/agents.conf:/etc/nginx/conf.d/agents.conf:ro
    depends_on:
      - satoshi
      - nakamoto
      - szabo
      - finney
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────
  # AGENTIC TIER
  # ──────────────────────────────────────────

  # Agent 1: SATOSHI — Whale Takibi & Pattern Analizi
  satoshi:
    build:
      context: ./agents/satoshi
      dockerfile: Dockerfile
    container_name: satoshi
    restart: unless-stopped
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.41
    environment:
      - AGENT_NAME=satoshi
      - AGENT_ROLE=whale_tracker
      - OLLAMA_URL=http://da-vinci:11434
      - REDIS_URL=redis://redis-bus:6379
      - SENTINEL_API=https://stacks-defi-sentinel-production.up.railway.app
      - MODEL=phi3:mini
      - POLL_INTERVAL=30
    volumes:
      - agent-shared:/shared
    depends_on:
      redis:
        condition: service_healthy
      da-vinci:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Agent 2: NAKAMOTO — DEX Arbitraj & Fiyat Analizi
  nakamoto:
    build:
      context: ./agents/nakamoto
      dockerfile: Dockerfile
    container_name: nakamoto
    restart: unless-stopped
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.42
    environment:
      - AGENT_NAME=nakamoto
      - AGENT_ROLE=dex_analyzer
      - OLLAMA_URL=http://da-vinci:11434
      - REDIS_URL=redis://redis-bus:6379
      - SENTINEL_API=https://stacks-defi-sentinel-production.up.railway.app
      - MODEL=phi3:mini
      - POLL_INTERVAL=60
    volumes:
      - agent-shared:/shared
    depends_on:
      redis:
        condition: service_healthy
      da-vinci:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Agent 3: SZABO — Kontrat Güvenlik Taraması
  szabo:
    build:
      context: ./agents/szabo
      dockerfile: Dockerfile
    container_name: szabo
    restart: unless-stopped
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.43
    environment:
      - AGENT_NAME=szabo
      - AGENT_ROLE=security_scanner
      - OLLAMA_URL=http://da-vinci:11434
      - REDIS_URL=redis://redis-bus:6379
      - SENTINEL_API=https://stacks-defi-sentinel-production.up.railway.app
      - MODEL=phi3:mini
      - POLL_INTERVAL=120
    volumes:
      - agent-shared:/shared
    depends_on:
      redis:
        condition: service_healthy
      da-vinci:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Agent 4: FINNEY — Kullanıcı Rapor & Bildirim
  finney:
    build:
      context: ./agents/finney
      dockerfile: Dockerfile
    container_name: finney
    restart: unless-stopped
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.44
    environment:
      - AGENT_NAME=finney
      - AGENT_ROLE=reporter
      - OLLAMA_URL=http://da-vinci:11434
      - REDIS_URL=redis://redis-bus:6379
      - SENTINEL_API=https://stacks-defi-sentinel-production.up.railway.app
      - MODEL=phi3:mini
      - REPORT_HOUR=7
    volumes:
      - agent-shared:/shared
    depends_on:
      redis:
        condition: service_healthy
      da-vinci:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────────────────────────────────────────
  # ORCHESTRATOR — Cluster yönetim paneli
  # ──────────────────────────────────────────
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    restart: unless-stopped
    networks:
      sentinel-net:
        ipv4_address: 172.28.0.50
    ports:
      - "9000:9000"
    environment:
      - REDIS_URL=redis://redis-bus:6379
      - OLLAMA_URL=http://da-vinci:11434
      - AGENTS=satoshi,nakamoto,szabo,finney
    volumes:
      - agent-shared:/shared
    depends_on:
      - redis
      - satoshi
      - nakamoto
      - szabo
      - finney
